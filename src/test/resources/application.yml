spring:
  application:
    name: blog-test
  datasource:
    url: jdbc:h2:mem:blog;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Tests get a throwaway schema straight from the entities, so they stay fast and isolated.
  # This does not change the application strategy: dev uses Hibernate auto-DDL and prod uses
  # Flyway migrations (see src/main/resources/db/migration).
  flyway:
    enabled: false
